[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmcra-local"
version = "0.1.0"
description = "Owner-local TMCRA agent memory engine and loopback API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Yu Haoxin" }]
dependencies = [
  "fastapi==0.139.0",
  "huggingface-hub==1.23.0",
  "numpy==2.4.3",
  "safetensors==0.8.0",
  "tokenizers==0.22.2",
  "transformers==5.10.2",
  "uvicorn[standard]==0.50.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.0.3"]

[project.scripts]
tmcra-local = "tmcra_local.__main__:main"
tmcra-workflow = "tmcra_local.workflow_client:main"
tmcra-workflow-mcp = "tmcra_local.workflow_mcp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
tmcra_local = ["ui/*.html", "ui/*.js", "ui/*.css", "ui/*.json"]
